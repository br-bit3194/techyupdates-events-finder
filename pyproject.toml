[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "techyupdates-tech-events-finder"
version = "1.0.0"
description = "Autonomous Global & Regional Tech Events, Conferences, Meetups, and Summits Radar for Developers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "google-genai>=1.3.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
