name: Daily Tech Events Ingestion & Broadcast Pipeline

on:
  schedule:
    # Runs daily at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run without sending to Telegram'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Ingest, Deduplicate, Classify & Broadcast Tech Events
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Execute Autonomous Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_COMMUNITY_CHANNEL_ID: ${{ secrets.TELEGRAM_COMMUNITY_CHANNEL_ID || secrets.TELEGRAM_CHANNEL_ID || '@techy_hackathons_updates' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python api/trigger.py

      - name: Commit & Push Updated Sent History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json
          if git diff --staged --quiet; then
            echo "No changes in sent_history.json to commit."
          else
            git commit -m "chore(history): update sent_history.json [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD || echo "Failed to push history changes"
          fi
